name: Build and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # Live address. Every canonical, hreflang and sitemap URL is built from this.
      SITE_BASE: https://solostarterhq.com
      OWNER_NAME: SoloStarterHQ
      OWNER_ADDRESS: 80A Ruskin Ave|Welling, London DA16 3QQ|United Kingdom
      OWNER_EMAIL: raoprasji@gmail.com
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: python build.py _site
      - name: SEO checks (stops the deploy if any page fails)
        run: python seo_check.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
